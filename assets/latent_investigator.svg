<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient inside Hexagon -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0c172e"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>

    <!-- Bezel Border Gradient -->
    <linearGradient id="hexBezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Inner Radial Epistemic Glow -->
    <radialGradient id="centerCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7f00ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c172e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Intense Filter for Core Reticle -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hexagon Clip Path (Pointy Top, R=88) -->
    <clipPath id="hexClip">
      <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"/>
    </clipPath>
  </defs>

  <!-- Outside is completely transparent; all graphics clipped inside the hexagon -->
  <g clip-path="url(#hexClip)">
    <!-- Hexagon Deep Field Background -->
    <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="url(#bgGradient)"/>

    <!-- Subtle Epistemic Radar Grid / Coordinate Orbits -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#223558" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#2c4778" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.5"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#3d67ad" stroke-width="0.8" opacity="0.6"/>
    <circle cx="100" cy="100" r="14" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.5"/>

    <!-- Subtle Axis Alignment Reticles -->
    <line x1="100" y1="20" x2="100" y2="180" stroke="#1d3056" stroke-width="0.75" opacity="0.4"/>
    <line x1="30" y1="100" x2="170" y2="100" stroke="#1d3056" stroke-width="0.75" opacity="0.4"/>
    <line x1="45" y1="68" x2="155" y2="132" stroke="#182848" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3"/>
    <line x1="45" y1="132" x2="155" y2="68" stroke="#182848" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3"/>

    <!-- Ambient Core Radiance -->
    <circle cx="100" cy="100" r="46" fill="url(#centerCoreGlow)"/>

    <!-- Causal Graph Edges / Hypothesis Trees -->
    <!-- Validated Branch (Emerald Path) -->
    <path d="M 100,100 L 132,74 L 154,62" fill="none" stroke="#00e676" stroke-width="1.8" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
    <line x1="132" y1="74" x2="150" y2="92" stroke="#00e676" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

    <!-- Contested Strategic Alternative (Amber / Cyan Conflict Path) -->
    <path d="M 100,100 L 68,76 L 46,65" fill="none" stroke="#ffb300" stroke-width="1.6" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
    <line x1="68" y1="76" x2="52" y2="98" stroke="#ff9100" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

    <!-- Deep Latent Infiltration Path (Violet Spectrum) -->
    <path d="M 100,100 L 126,128 L 152,142" fill="none" stroke="#9d4edd" stroke-width="1.6" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>

    <!-- Pruned / Ruled Out Counterfactual Path (Ruby/Rose Diminishing) -->
    <path d="M 100,100 L 74,126 L 48,138" fill="none" stroke="#f72585" stroke-width="1.2" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.7"/>

    <!-- Top & Bottom Anchor Evidence Rays -->
    <line x1="100" y1="100" x2="100" y2="40" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
    <line x1="100" y1="100" x2="100" y2="158" stroke="#4facfe" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.6"/>

    <!-- Secondary Causal Interconnects -->
    <path d="M 132,74 Q 145,100 126,128" fill="none" stroke="#4895ef" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.5"/>
    <path d="M 68,76 Q 54,102 74,126" fill="none" stroke="#7209b7" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.4"/>

    <!-- Graph Nodes / Evidence & Hypothesis Vertices -->
    <!-- Top Source Node -->
    <circle cx="100" cy="40" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="100" cy="40" r="1.5" fill="#ffffff"/>

    <!-- Emerald Validated Target World -->
    <circle cx="154" cy="62" r="4.2" fill="#00e676" filter="url(#glow)"/>
    <circle cx="154" cy="62" r="2" fill="#ffffff"/>
    <circle cx="132" cy="74" r="2.8" fill="#69f0ae"/>

    <!-- Amber Contested Actor Node -->
    <circle cx="46" cy="65" r="3.8" fill="#ffb300" filter="url(#glow)"/>
    <circle cx="46" cy="65" r="1.8" fill="#ffffff"/>
    <circle cx="68" cy="76" r="2.5" fill="#ffd54f"/>

    <!-- Purple Latent Mechanism Node -->
    <circle cx="152" cy="142" r="3.2" fill="#b5179e" filter="url(#glow)"/>
    <circle cx="126" cy="128" r="2.5" fill="#7209b7"/>

    <!-- Pruned Red World Node -->
    <circle cx="48" cy="138" r="2.5" fill="#f72585" opacity="0.8"/>
    <circle cx="74" cy="126" r="2" fill="#b5179e" opacity="0.7"/>

    <!-- Bottom Sensor / Observation Witness -->
    <circle cx="100" cy="158" r="2.8" fill="#4facfe" filter="url(#glow)"/>
    <circle cx="100" cy="158" r="1.2" fill="#ffffff"/>

    <!-- Strategic Investigator Focal Aperture / Crosshair Reticle -->
    <g filter="url(#intenseGlow)">
      <!-- Prismatic Optical Aperture Bracket -->
      <path d="M 90,88 L 88,88 L 88,90" fill="none" stroke="#00f2fe" stroke-width="1.6"/>
      <path d="M 110,88 L 112,88 L 112,90" fill="none" stroke="#00f2fe" stroke-width="1.6"/>
      <path d="M 90,112 L 88,112 L 88,110" fill="none" stroke="#00f2fe" stroke-width="1.6"/>
      <path d="M 110,112 L 112,112 L 112,110" fill="none" stroke="#00f2fe" stroke-width="1.6"/>

      <!-- Inner Rotating Diamond Reticle -->
      <polygon points="100,88 112,100 100,112 88,100" fill="none" stroke="#00f2fe" stroke-width="1.4" opacity="0.9"/>
      
      <!-- Latent Core Singularity -->
      <circle cx="100" cy="100" r="4.5" fill="#00f2fe"/>
      <circle cx="100" cy="100" r="2" fill="#ffffff"/>
    </g>

    <!-- Concentric Target Tick Marks -->
    <line x1="94" y1="100" x2="97" y2="100" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="103" y1="100" x2="106" y2="100" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="100" y1="94" x2="100" y2="97" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="100" y1="103" x2="100" y2="106" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Outer Decorative Concentric Hexagon Grid Wireframe inside bezel -->
    <polygon points="100,22 168,61 168,139 100,178 32,139 32,61" 
             fill="none" stroke="#1d3056" stroke-width="0.8" opacity="0.6"/>
    <polygon points="100,28 162,64 162,136 100,172 38,136 38,64" 
             fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-dasharray="1,4" opacity="0.5"/>
  </g>

  <!-- Precise Outer Hexagonal Bezel (200px footprint, pointy top, R=88) -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" 
           fill="none" stroke="url(#hexBezelGradient)" stroke-width="3.5" 
           stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Thin Inner Accent Rim -->
  <polygon points="100,15 173,57.5 173,142.5 100,185 27,142.5 27,57.5" 
           fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4"
           stroke-linejoin="round"/>
</svg>
